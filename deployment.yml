---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-statefulset
  namespace: uday
spec:
  serviceName: "nginx"
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: uday
          image: nginx
          ports:
            - containerPort: 80
